<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小猫智能体 TUI 原型</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --panel: #191919;
      --panel-2: #222222;
      --line: #303030;
      --text: #e8e8e8;
      --muted: #8d8d8d;
      --accent: #4c9cff;
      --thought: #a38f55;
      --good: #9ad889;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      grid-template-rows: 1fr auto;
      min-width: 320px;
    }

    .transcript {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 30px 44px 24px;
      outline: none;
      background: var(--bg);
    }

    .transcript:focus-visible {
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .line {
      max-width: 1120px;
      margin: 0 auto;
      padding: 10px 0;
      line-height: 1.45;
    }

    .user-block {
      border-left: 4px solid var(--accent);
      background: #121212;
      padding: 18px 20px;
      font-size: 18px;
      font-weight: 700;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .thinking-block {
      border-left: 3px solid #252525;
      padding-left: 18px;
      color: #a8a8a8;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .thinking-label {
      margin-right: 8px;
      color: var(--thought);
      font-style: italic;
      font-weight: 700;
    }

    .assistant-block {
      color: var(--text);
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .dock {
      border-top: 1px solid var(--line);
      background: var(--panel);
      padding: 0 44px 18px;
    }

    .workline {
      max-width: 1120px;
      margin: 0 auto;
      min-height: 31px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      padding: 8px 0 2px;
      white-space: nowrap;
      overflow: hidden;
    }

    .pulse {
      width: 9px;
      height: 9px;
      border: 2px solid var(--accent);
      border-radius: 2px;
      flex: 0 0 auto;
      animation: pulse 1s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1); }
    }

    .work-main {
      color: var(--text);
      font-weight: 700;
    }

    .work-muted {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .facts {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      padding: 0 0 10px;
    }

    .fact {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fact strong {
      color: var(--accent);
      font-weight: 700;
    }

    .composer {
      max-width: 1120px;
      margin: 0 auto;
      border-left: 4px solid var(--accent);
      background: var(--panel-2);
      padding: 18px 24px 14px;
    }

    textarea {
      width: 100%;
      min-height: 50px;
      max-height: 150px;
      resize: vertical;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 20px;
      line-height: 1.45;
    }

    textarea:focus {
      outline: none;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      color: var(--text);
      outline: none;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      max-width: 1120px;
      margin: 0 auto;
      padding: 10px 0 0;
    }

    .toolbar button {
      padding: 5px 8px;
    }

    .jump {
      position: fixed;
      right: 18px;
      bottom: 160px;
      display: none;
      padding: 6px 9px;
      color: #06110f;
      border-color: var(--accent);
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    }

    .jump.visible {
      display: block;
    }

    @media (max-width: 760px) {
      .transcript { padding: 16px 14px 20px; }
      .dock { padding: 0 14px 14px; }
      .facts { grid-template-columns: 1fr; gap: 4px; }
      .jump { bottom: 220px; }
    }
  </style>
</head>
<body>
  <main id="transcript" class="transcript" tabindex="0" aria-label="Kitty transcript"></main>

  <section class="dock" aria-label="runtime facts">
    <div class="workline">
      <span id="pulse" class="pulse" hidden></span>
      <span id="work-main" class="work-main">空闲</span>
      <span>·</span>
      <span id="work-detail" class="work-muted">没有后台任务或子代理正在执行</span>
    </div>

    <div class="facts">
      <div class="fact"><strong>后台任务</strong> <span id="background">空闲</span></div>
      <div class="fact"><strong>子代理</strong> <span id="subagent">空闲</span></div>
      <div class="fact"><strong>上下文</strong> <span id="context">18,420 / 128,000 tokens</span></div>
    </div>

    <div class="composer">
      <textarea id="input" spellcheck="false" placeholder="输入消息。Enter 发送，Shift+Enter 换行。"></textarea>
    </div>

    <div class="toolbar">
      <button id="append">模拟工具事件</button>
      <button id="simulate">模拟动态任务</button>
      <button id="clear">清空</button>
    </div>
  </section>

  <button id="jump" class="jump">回到底部</button>

  <script>
    const transcript = document.getElementById("transcript");
    const input = document.getElementById("input");
    const append = document.getElementById("append");
    const simulate = document.getElementById("simulate");
    const clear = document.getElementById("clear");
    const jump = document.getElementById("jump");
    const background = document.getElementById("background");
    const subagent = document.getElementById("subagent");
    const context = document.getElementById("context");
    const pulse = document.getElementById("pulse");
    const workMain = document.getElementById("work-main");
    const workDetail = document.getElementById("work-detail");

    let lineCount = 0;
    let contextTokens = 18420;
    let taskRunning = false;
    let taskTimer = null;
    let taskStep = 0;

    const seed = [
      ["user", "你好"],
      ["thinking", "用户在中文里打招呼。应该直接、简短地回应。"],
      ["assistant", "你好！有什么我可以帮你的吗？"],
    ];

    function atBottom() {
      return transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 12;
    }

    function scrollToBottom() {
      transcript.scrollTop = transcript.scrollHeight;
      jump.classList.remove("visible");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function addLine(role, text) {
      const shouldStick = atBottom();
      const line = document.createElement("div");
      line.className = "line";

      if (role === "user") {
        line.innerHTML = `<div class="user-block">${escapeHtml(text)}</div>`;
      } else if (role === "thinking") {
        line.innerHTML = `<div class="thinking-block"><span class="thinking-label">Thinking:</span>${escapeHtml(text)}</div>`;
      } else {
        line.innerHTML = `<div class="assistant-block">${escapeHtml(text)}</div>`;
      }

      transcript.appendChild(line);
      lineCount += 1;
      contextTokens += Math.max(8, Math.floor(String(text).length / 3));
      context.textContent = `${contextTokens.toLocaleString()} / 128,000 tokens`;

      if (shouldStick) {
        scrollToBottom();
      } else {
        jump.classList.add("visible");
      }
    }

    function setWork(main, detail, active) {
      workMain.textContent = main;
      workDetail.textContent = detail;
      pulse.hidden = !active;
    }

    function sendMessage() {
      const value = input.value.trim();
      if (!value) return;
      input.value = "";
      input.style.height = "auto";
      addLine("user", value);
      setWork("思考", "模型正在生成回复", true);
      setTimeout(() => addLine("thinking", "保持主对话干净。工具调用、工具结果和后台输出都只进入底部动态现场。"), 160);
      setTimeout(() => {
        addLine("assistant", "收到。我会把主区域留给用户输入、思考和最终回复；工具与后台状态放在底部动态展示。");
        setWork("空闲", "没有后台任务或子代理正在执行", false);
      }, 520);
    }

    function appendToolEvent() {
      const items = [
        ["工具", "bash rg \"createRuntimeScene\" src"],
        ["结果", "找到 runtime scene 投影"],
        ["后台", "verify 仍在运行"],
        ["子代理", "正在汇总壳层边界"],
      ];
      const item = items[lineCount % items.length];
      setWork(item[0], item[1], true);
      setTimeout(() => setWork("空闲", "工具事件已收束，主对话未追加工具账本", false), 900);
    }

    function simulateTask() {
      taskRunning = !taskRunning;
      if (taskRunning) {
        taskStep = 0;
        runTaskStep();
        taskTimer = setInterval(runTaskStep, 650);
      } else {
        stopTask("已手动停止");
      }
    }

    function runTaskStep() {
      const frames = [
        {
          bg: "运行中：npm.cmd run verify · 准备",
          sub: "运行中：审查 runtime scene · 读取事实",
          main: "Build",
          detail: "npm.cmd run verify · 准备测试环境",
        },
        {
          bg: "运行中：npm.cmd run verify · 构建",
          sub: "运行中：审查 runtime scene · 对齐边界",
          main: "Build",
          detail: "typecheck + build",
        },
        {
          bg: "运行中：npm.cmd run verify · 测试",
          sub: "运行中：审查 runtime scene · 汇总结论",
          main: "子代理",
          detail: "检查壳层是否只消费 runtime facts",
        },
        {
          bg: "运行中：npm.cmd run verify · 收尾",
          sub: "等待后台结果",
          main: "Build",
          detail: "测试输出持续追加，主对话不被工具结果污染",
        },
        {
          bg: "空闲",
          sub: "空闲",
          main: "完成",
          detail: "后台任务完成；子代理返回简短结论",
        },
      ];

      const frame = frames[Math.min(taskStep, frames.length - 1)];
      background.textContent = frame.bg;
      subagent.textContent = frame.sub;
      setWork(frame.main, frame.detail, taskStep < frames.length - 1);

      taskStep += 1;
      if (taskStep >= frames.length) {
        taskRunning = false;
        if (taskTimer) clearInterval(taskTimer);
        taskTimer = null;
      }
    }

    function stopTask(reason) {
      taskRunning = false;
      if (taskTimer) clearInterval(taskTimer);
      taskTimer = null;
      background.textContent = "空闲";
      subagent.textContent = "空闲";
      setWork("空闲", `后台任务和子代理${reason}`, false);
    }

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 150)}px`;
    });

    append.addEventListener("click", appendToolEvent);
    simulate.addEventListener("click", simulateTask);
    jump.addEventListener("click", scrollToBottom);

    clear.addEventListener("click", () => {
      transcript.innerHTML = "";
      lineCount = 0;
      contextTokens = 0;
      context.textContent = "0 / 128,000 tokens";
      jump.classList.remove("visible");
      transcript.focus();
    });

    transcript.addEventListener("scroll", () => {
      if (atBottom()) jump.classList.remove("visible");
    });

    window.addEventListener("keydown", (event) => {
      if (document.activeElement === input) return;
      const page = Math.max(160, transcript.clientHeight - 48);
      if (event.key === "PageUp") {
        event.preventDefault();
        transcript.scrollTop -= page;
      } else if (event.key === "PageDown") {
        event.preventDefault();
        transcript.scrollTop += page;
      } else if (event.key === "Home") {
        event.preventDefault();
        transcript.scrollTop = 0;
      } else if (event.key === "End") {
        event.preventDefault();
        scrollToBottom();
      }
    });

    for (let i = 0; i < 8; i += 1) {
      for (const item of seed) addLine(item[0], item[1]);
    }
    scrollToBottom();
    transcript.focus();
  </script>
</body>
</html>
